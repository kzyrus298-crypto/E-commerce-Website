<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <link rel="icon" type="image/png" href="Images/banana_favicon_96_vertical.png">
        <link rel="stylesheet" href="style.css">
        <title>Banana</title>
    </head>
    <body>

        <nav class="top-nav">
            <div class="logo">
                <ruby> Banana 
                    <rt>バナナ</rt> 
                </ruby>
            </div>
            <div class="navlinks">
                <a href="#">Orders</a>
                <a href="#">Accessories</a>
                <a href="#">Support</a>
                <a href="mailto:kzyrus298@gmail.com">Email Us</a>
            </div>
        </nav>

        <div class="hero-video">
            <video autoplay muted loop playsinline>
                <source src="Video/video.mp4" type="video/mp4">
            </video>
        </div>

        <div class="banner">
            <div class="hero">
                <div class="copy">
                    <h1>Great Phones, ripe for the picking.</h1>
                    <p>Authentic units, unlocked, ready to ship.</p>
                </div>

                <div class="phones">
                    <img src="Images/front.png" class="phone phone-1" alt="Iphone">
                    <img src="Images/back.png" class="phone phone-2" alt="Iphone">
                </div>
            </div>
        </div>

        <section class="products">
            <h2>Phones</h2>
            <div class="product-grid">

                <div class="product-card">
                    <img src="Images/IPHONE16.png" alt="Iphone 16">
                    <h3>Iphone 16</h3>
                    <div class="price-container">
                        <span class="old-price">₱14,999</span>
                        <span class="new-price">₱13,999</span>
                    </div>
                    <button> Add to Cart </button>
                </div>

            </div>
        </section>

        <div style="height:1200px;"></div>

        <audio id="bgMusic" loop>
            <source src="MUSIC/MYSB.mp3">
        </audio>

        <script src="script.js"></script>
    </body>
</html>
